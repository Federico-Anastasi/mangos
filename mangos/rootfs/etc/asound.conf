# mangOS sound: everything plays into a mixer on the virtual card of snd-aloop, and mangos-sound
# takes the mix to the speaker. Any rate and channel count is converted ("plug").
pcm.!default {
	type plug
	slave.pcm "mix"
}
pcm.mix {
	type dmix
	ipc_key 20261014
	ipc_perm 0666
	slave {
		pcm "hw:Loopback,0,0"
		format S16_LE
		rate 48000
		channels 2
		period_time 10000
		buffer_time 60000
	}
}
ctl.!default {
	type hw
	card Loopback
}
