<!DOCTYPE html>
<!-- Test page for sound from pages: a half-second beep with Web Audio when it opens, and what the
     browser says about it. Shown on the phone with `pim show page_sound.html full`; whether the
     sound reached the speaker is read in /sys/kernel/debug/abox/status ("playback: running"). -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prova del suono</title>
<style>body { margin: 0; background: #101418; color: #e8e8e8; font: 5vw/1.5 sans-serif; padding: 24vw 6vw; } b { color: #7fd1b9; }</style>
</head>
<body>
<div>contesto audio: <b id="state">…</b></div>
<div>frequenza: <b id="rate">…</b></div>
<script>
  var ctx = new AudioContext();
  document.getElementById('rate').textContent = ctx.sampleRate + ' Hz';
  function beep() {
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 660;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  }
  ctx.resume().then(function () {
    document.getElementById('state').textContent = ctx.state;
    beep();
  });
  setTimeout(function () { document.getElementById('state').textContent = ctx.state; }, 1500);
</script>
</body>
</html>
