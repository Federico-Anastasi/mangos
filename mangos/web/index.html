<!doctype html>
<html lang="it" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mangOS</title>
<!--
  mangOS UI: the room, the entity that lives in it, the status bar, the keyboard, the
  microphone and the window for the pages made by the entity. It is served by mangos-bridge,
  which sends it the events and which it asks for the status, the furnishing and the pages.

  Three stacked WebGL canvases, because the GPU is small:
    room    full screen, low resolution, redrawn only when needed;
    smoke   the entity's body, low resolution, redrawn every frame (every other one when nothing happens);
    eyes    eyes and eyebrows, at a higher resolution because they must be sharp.
  Smoke and eyes sit in a box that moves and scales with a CSS transform, without redrawing.
-->
<style>
@font-face { font-family: "Inter"; src: url("fonts/Inter-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("fonts/Inter-SemiBold.ttf"); font-weight: 600; }
:root { --text: #F1F0EB; --gray: #8F8E88; --bg: #050507; color-scheme: dark; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: "Inter", sans-serif; -webkit-user-select: none; user-select: none; cursor: none; }
/* A finger does not scroll or zoom the room; it scrolls only inside the pages window. */
#room, #objects, #entity, #statusbar, #lines, #compose, #voice, #pages, #keyboard, #blackout { touch-action: none; }
#room { position: absolute; inset: 0; width: 100%; height: 100%; }
#objects { position: absolute; inset: 0; pointer-events: none; perspective-origin: 50% 50%; overflow: hidden; }
#objects img { position: absolute; transform-origin: 0 0; backface-visibility: hidden; }
#entity { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform; }
#entity canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
/* The laptop sits in the entity's box, so it follows it and shrinks with it. */
#laptop { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; overflow: visible;
  transform: translateY(25%) scale(.8); transform-origin: 50% 80%; transition: opacity .25s ease, transform .4s cubic-bezier(.2, .9, .25, 1.2); }
body.working #laptop { opacity: 1; transform: none; }
#laptop svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#laptopImg { position: absolute; width: 64%; aspect-ratio: 420 / 262; background: url(laptop.png) 0 0 / 1900% 100% no-repeat; }
#statusbar { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center;
  padding: 3.4vw 5vw; font-size: 3.3vw; font-weight: 600; font-variant-numeric: tabular-nums; }
#statusbar .right { display: flex; align-items: center; gap: 3vw; }
#wifi { display: flex; align-items: flex-end; gap: .55vw; height: 3vw; }
#wifi i { width: .9vw; background: var(--text); border-radius: .3vw; opacity: .28; }
#wifi i:nth-child(1) { height: 30%; } #wifi i:nth-child(2) { height: 53%; } #wifi i:nth-child(3) { height: 76%; } #wifi i:nth-child(4) { height: 100%; }
#wifi[data-bars="1"] i:nth-child(-n+1), #wifi[data-bars="2"] i:nth-child(-n+2),
#wifi[data-bars="3"] i:nth-child(-n+3), #wifi[data-bars="4"] i:nth-child(-n+4) { opacity: 1; }
#wifi[data-bars="0"] { opacity: .5; }
#battery { display: flex; align-items: center; gap: 1.4vw; }
#batteryIcon { width: 6.2vw; height: 3vw; border: .45vw solid var(--text); border-radius: .9vw; position: relative; box-sizing: border-box; }
#batteryIcon::after { content: ""; position: absolute; right: -1.1vw; top: 22%; width: .6vw; height: 56%; background: var(--text); border-radius: 0 .4vw .4vw 0; }
#chargeFill { position: absolute; left: .35vw; top: .35vw; bottom: .35vw; background: var(--text); border-radius: .35vw; }
#battery[data-charging="1"] #chargeFill { background: #8FE3A8; }
#lines { position: absolute; left: 6.5vw; right: 6.5vw; bottom: 8vw; display: flex; flex-direction: column; gap: 2vw;
  text-shadow: 0 .3vw 1.6vw rgba(0, 0, 0, .85); }
#userLine { font-size: 3.7vw; color: var(--gray); min-height: 1.3em; }
#replyLine { font-size: 6.4vw; font-weight: 600; line-height: 1.16; letter-spacing: -.01em; min-height: 2.4em; }
/* A long phrase is written smaller, so it does not cover the room (data-long is set by the
   script). */
#replyLine[data-long="1"] { font-size: 5.2vw; line-height: 1.2; }
#replyLine[data-long="2"] { font-size: 4.3vw; line-height: 1.25; font-weight: 500; }
#panel { position: absolute; left: 4vw; right: 4vw; top: 34vw; bottom: 46vw; border-radius: 5vw; overflow: hidden;
  background: #101014; box-shadow: 0 2vw 9vw rgba(0, 0, 0, .65); display: flex; flex-direction: column; }
#panel[hidden], #surface[hidden], #list[hidden] { display: none; }
#viewfinder { position: absolute; right: 5vw; top: 36vw; width: 60vw; border-radius: 5vw;
  border: .3vw solid rgba(241, 240, 235, .35); box-shadow: 0 2vw 8vw rgba(0, 0, 0, .55); z-index: 4; background: #000; }
#viewfinder[hidden] { display: none; }
#viewfinder.shot { border-color: var(--text); }
#header { flex: none; height: 11vw; display: flex; align-items: center; gap: 2vw; padding: 0 1.5vw 0 5vw; font-size: 3.6vw; font-weight: 600; }
#title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#close { width: 9vw; height: 9vw; border: 0; border-radius: 50%; background: transparent; color: var(--text); font: 400 6vw/1 "Inter", sans-serif; }
#surface { flex: 1; min-height: 0; width: 100%; border: 0; background: #fff; }
#list { flex: 1; min-height: 0; overflow-y: auto; padding: 1vw 3vw 4vw; display: flex; flex-direction: column; gap: 2vw; touch-action: pan-y; }
#list button { text-align: left; border: 0; border-radius: 3vw; background: #1b1b22; color: var(--text); padding: 3.4vw 4vw; font: 600 4.2vw "Inter", sans-serif; }
#list button small { display: block; font-weight: 400; font-size: 3.2vw; color: var(--gray); margin-top: .8vw; }
#list p { color: var(--gray); font-size: 4vw; padding: 4vw 2vw; margin: 0; }
body.page-open #replyLine { font-size: 4.8vw; min-height: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
body.page-open.typing #panel { bottom: 104vw; }
#entity, #statusbar, #lines, #compose, #voice, #pages { z-index: 2; }
#panel { z-index: 3; }
#keyboard { z-index: 4; }
#blackout { z-index: 6; }
#offCharging { z-index: 5; }
#volume { z-index: 4; }
/* The page as background: it takes the whole screen in place of the room; the entity, the status
   bar, the phrase and the place to type stay on top. */
body.background #panel, body.background.typing #panel { inset: 0; border-radius: 0; z-index: 1; box-shadow: none; }
body.background #header { position: absolute; right: 2vw; top: 10vw; height: auto; padding: 0; z-index: 1; }
body.background #title { display: none; }
body.background #close { background: rgba(5, 5, 7, .78); width: 11vw; height: 11vw; }
body.background #lines { background: rgba(5, 5, 7, .74); border-radius: 4vw; padding: 3vw 4vw; left: 4vw; right: 4vw; }
body.background #statusbar { background: linear-gradient(rgba(5, 5, 7, .7), rgba(5, 5, 7, 0)); }
body.background #compose, body.background #voice, body.background #pages { background: rgba(5, 5, 7, .78); }
/* The page in full (games): everything goes away but the entity, small in the corner, and a
   small cross; a tap on the entity talks to it. */
body.full #panel, body.full.typing #panel { inset: 0; border-radius: 0; z-index: 1; box-shadow: none; }
body.full #header { position: absolute; right: 1.5vw; top: 1.5vw; height: auto; padding: 0; z-index: 1; }
body.full #title, body.full #expand, body.background #expand { display: none; }
body.full #close { background: rgba(5, 5, 7, .55); width: 8vw; height: 8vw; font-size: 4.6vw; }
body.full #statusbar, body.full #lines, body.full #compose, body.full #voice, body.full #pages, body.full #keyboard { display: none; }
#expand { width: 9vw; height: 9vw; border: 0; border-radius: 50%; background: transparent; color: var(--text); display: grid; place-items: center; }
#expand svg { pointer-events: none; }
#blackout { position: absolute; inset: 0; background: #000; }
#volume { position: absolute; right: 2.6vw; top: 30vw; width: 10vw; height: 44vw; border-radius: 5vw; background: rgba(18, 18, 22, .82);
  box-shadow: 0 1vw 4vw rgba(0, 0, 0, .45); overflow: hidden; pointer-events: none; opacity: 0; transform: translateX(16vw) scale(.9);
  transition: opacity .28s ease, transform .34s cubic-bezier(.2, .9, .25, 1.15); }
#volume.visible { opacity: 1; transform: none; }
#volume .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #f2f2f4; transition: height .16s ease-out; }
#volume svg { position: absolute; left: 50%; bottom: 3vw; width: 5vw; height: 5vw; margin-left: -2.5vw; mix-blend-mode: difference; fill: #f2f2f4; }
/* Off-charging: only the battery, on black. */
#offCharging { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vw; touch-action: none; }
#offCharging[hidden] { display: none; }
#offCharging .cell { width: 34vw; height: 60vw; border: 1.4vw solid #f2f2f4; border-radius: 6vw; position: relative; display: flex; align-items: flex-end; padding: 1.6vw; box-sizing: border-box; }
#offCharging .cell::before { content: ''; position: absolute; left: 50%; top: -4.4vw; width: 11vw; height: 3vw; margin-left: -5.5vw; background: #f2f2f4; border-radius: 1.5vw 1.5vw 0 0; }
#offCharging .level { width: 100%; background: #39d98a; border-radius: 3.6vw; min-height: 3vw; }
#offCharging .number { font-size: 15vw; font-weight: 600; color: #f2f2f4; }
#offCharging .caption { font-size: 4.4vw; color: #9a9aa3; }
#pages { display: grid; place-items: center; position: absolute; right: 6.5vw; bottom: 5vw; width: 12vw; height: 12vw; border-radius: 50%; border: .3vw solid rgba(241, 240, 235, .22);
  background: rgba(5, 5, 7, .35); color: var(--text); font: 400 5vw/1 "Inter", sans-serif; padding: 0; }
body.typing #pages { display: none; }
#pages svg { pointer-events: none; }
#compose { position: absolute; left: 6.5vw; right: 35.5vw; bottom: 5vw; height: 12vw; border-radius: 6vw; border: .3vw solid rgba(241, 240, 235, .22);
  background: rgba(5, 5, 7, .35); color: var(--gray); font: 400 4vw "Inter", sans-serif; text-align: left; padding: 0 5vw; }
body:not(.typing) #lines { bottom: 21vw; }
body.typing #compose { display: none; }
#voice { display: grid; place-items: center; position: absolute; right: 21vw; bottom: 5vw; width: 12vw; height: 12vw; border-radius: 50%; border: .3vw solid rgba(241, 240, 235, .22);
  background: rgba(5, 5, 7, .35); color: var(--text); padding: 0; transition: background .2s, border-color .2s; }
#voice svg { pointer-events: none; }
body.typing #voice { display: none; }
body.listening #voice { border-color: var(--text); background: rgba(241, 240, 235, .16); animation: listening 1.1s ease-in-out infinite; }
body.transcribing #voice { border-color: var(--text); background: rgba(241, 240, 235, .28); }
/* Conversation open: the border stays lit even while the entity thinks or replies. */
body.conversing #voice { border-color: var(--text); }
@keyframes listening { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
body.typing #lines { bottom: 82vw; }
#keyboard { position: absolute; left: 0; right: 0; bottom: 0; padding: 2vw 1vw 3vw; background: #0b0b0e; display: flex; flex-direction: column; gap: 1.6vw; }
#keyboard[hidden] { display: none; }
#field { margin: 0 2vw 1vw; min-height: 11vw; border-radius: 3vw; background: #17171d; padding: 2.6vw 4vw; box-sizing: border-box; font-size: 4.6vw; line-height: 1.25; overflow-wrap: anywhere; }
#field::after { content: ""; display: inline-block; width: .5vw; height: 1em; background: var(--text); vertical-align: -.15em; margin-left: .4vw; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.row { display: flex; justify-content: center; gap: 1.2vw; }
.key { flex: 1 1 0; max-width: 8.6vw; height: 12.5vw; border: 0; border-radius: 1.8vw; background: #23232c; color: var(--text); font: 400 5.4vw "Inter", sans-serif; padding: 0; }
.key.wide { flex: 1.6 1 0; max-width: 14vw; background: #17171d; font-size: 4vw; }
.key.space { flex: 5 1 0; max-width: none; }
.key.enter { flex: 2.2 1 0; max-width: 20vw; background: var(--text); color: #0b0b0e; font-weight: 600; font-size: 4vw; }
.key.pressed { background: #3a3a48; }
#failure { position: absolute; inset: 0; display: grid; place-items: center; padding: 8vw; text-align: center; color: var(--gray); font-size: 4vw; }
</style>
<script>
// Kept apart from the main script: if that one breaks, "pim reload" can still make the page reload.
new EventSource('events').onmessage = function (m) {
  if (JSON.parse(m.data).type === 'reload') location.reload();
};
</script>
</head>
<body>
<canvas id="room"></canvas>
<div id="objects"></div>
<div id="entity"><canvas id="smoke"></canvas><canvas id="eyes"></canvas>
<!-- The laptop: 19 rendered poses in laptop.png, from 45 degrees left to 45 right; drawLaptop picks one. -->
<div id="laptop" aria-hidden="true">
  <svg viewBox="0 0 200 200"><defs><radialGradient id="screenGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#cfe6ff" stop-opacity=".8"/><stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/></radialGradient></defs><ellipse id="laptopGlow" fill="url(#screenGlow)"/></svg>
  <div id="laptopImg"></div>
</div></div>
<div id="statusbar">
  <span id="clock"></span>
  <span class="right">
    <span id="wifi" data-bars="0"><i></i><i></i><i></i><i></i></span>
    <span id="battery"><span id="percent"></span><span id="batteryIcon"><span id="chargeFill"></span></span></span>
  </span>
</div>
<div id="lines"><div id="userLine"></div><div id="replyLine"></div></div>
<button id="compose">Scrivi…</button>
<button id="voice" aria-label="Parla"><svg viewBox="0 0 24 24" width="46%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
<button id="pages" aria-label="Pagine già fatte"><svg viewBox="0 0 24 24" width="46%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="13" height="16" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V8"/></svg></button>
<img id="viewfinder" alt="" hidden>
<div id="panel" hidden>
  <div id="header"><span id="title"></span><button id="expand" aria-label="A tutto schermo"><svg viewBox="0 0 24 24" width="55%" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="close" aria-label="Chiudi">×</button></div>
  <iframe id="surface" title="Pagina fatta dall'entità" sandbox="allow-scripts allow-forms"></iframe>
  <div id="list" hidden></div>
</div>
<div id="keyboard" hidden><div id="field"></div></div>
<div id="volume"><div class="fill" id="volumeFill"></div><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5z"/></svg></div>
<div id="offCharging" hidden><div class="cell"><div class="level" id="offChargingLevel"></div></div><div class="number" id="offChargingNumber">--</div><div class="caption" id="offChargingCaption">In carica</div></div>
<div id="blackout" hidden></div>

<script>
(function () {
  'use strict';

  // ---------- measures ----------
  // The scene measures, which the shaders receive too (SCENE). The screen width is FIELD units,
  // with the origin at the center and y pointing up.
  var FIELD = 3.2, RB = 1.18;
  var FOCAL = 2.2, BACK_Z = -9.0, FLOOR = -0.95, CEILING = 2.6, HALF_WIDTH = 1.5, EYE_Z = 3.4;
  var DIVIDER_FIRST = -2.2, DIVIDER_GAP = 2.4;    // the walls between the rooms, in world z
  var DIVIDERS = [0, 1, 2].map(function (k) { return DIVIDER_FIRST - k * DIVIDER_GAP; });
  var RES_ROOM = 0.25;                   // room resolution relative to the screen
  var RES_SMOKE = 200;                   // side of the smoke canvas, in pixels
  var RES_EYES = 2 * RES_SMOKE;
  var CALM_AFTER_MS = 3000;              // after this long with nothing happening, half of the frames are skipped

  var COLORS = {
    blue: [[5, 14, 41], [22, 55, 128], [87, 133, 230]],
    pink: [[44, 6, 28], [196, 52, 124], [255, 164, 206]],
    mango: [[38, 13, 2], [176, 80, 10], [255, 190, 100]]
  };

  // ---------- shaders ----------
  var SHARED = { RB: RB, FIELD: FIELD, EYE_Z: EYE_Z, FOCAL: FOCAL, BACK_Z: BACK_Z, FLOOR: FLOOR, CEILING: CEILING,
                 HALF_WIDTH: HALF_WIDTH, DIVIDER_FIRST: DIVIDER_FIRST, DIVIDER_GAP: DIVIDER_GAP };
  var SCENE = Object.keys(SHARED).map(function (name) {
    var v = SHARED[name];
    return 'const float ' + name + ' = ' + (Number.isInteger(v) ? v.toFixed(1) : String(v)) + ';';
  }).concat('const int DIVIDER_COUNT = ' + DIVIDERS.length + ';').join('\n');
  var VERTEX = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';

  var COMMON = [
    'precision highp float;',
    'uniform vec2 uRes; uniform vec3 uDeep; uniform vec3 uMid; uniform vec3 uLight;',
    SCENE,
    'const float R0 = 0.78;',
    'const vec2 EYE = vec2(0.27, 0.0); const vec2 BULB = vec2(0.2, 0.25);',
    'const vec3 L = vec3(-0.5256, 0.6690, 0.5256);',   // light direction, already normalized
    'mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }'
  ].join('\n');

  // The room: the corridor with the dividers and the furniture, a light above, the entity's soft
  // shadow and a thread of its color bouncing off the walls.
  var ROOM = COMMON + [
    'uniform vec2 uPos; uniform float uSc; uniform float uDark; uniform vec3 uWalls; uniform vec2 uCam; uniform float uTurn;',
    'const float RADIUS = 0.62; const float BEHIND_Z = 5.6;',
    // A divider between two rooms: a wall from side to side with a gap in the middle, which the ray
    // crosses only through the gap.
    'float divider(vec3 ro, vec3 rd, float zd, float t){',
    '  float k = (zd - ro.z) / rd.z; if (k <= 0.0 || k >= t) return t;',
    '  vec3 q = ro + rd * k; if (abs(q.x) < 0.4 && q.y > FLOOR && q.y < FLOOR + 1.85) return t;',
    '  return k; }',
    // uTurn: how far the view turns around itself (0 looks straight to the end of the corridor).
    'vec3 turn(vec3 v){ float co = cos(uTurn), si = sin(uTurn); return vec3(v.x * co - v.z * si, v.y, v.x * si + v.z * co); }',
    // The furniture is made of real solids (boxes, cylinders, spheres). Each primitive updates t
    // and n only if it is nearer than the point already found, so the furniture in front hides what
    // is behind.
    'bool box(vec3 ro, vec3 rd, vec3 a, vec3 b, inout float t, inout vec3 n){',
    '  vec3 d = rd + vec3(1e-7); vec3 i = 1.0 / d; vec3 t1 = (a - ro) * i; vec3 t2 = (b - ro) * i;',
    '  vec3 lo = min(t1, t2); vec3 hi = max(t1, t2);',
    '  float tn = max(lo.x, max(lo.y, lo.z)); float tf = min(hi.x, min(hi.y, hi.z));',
    '  if (tn > tf || tf < 0.0 || tn < 0.0 || tn >= t) return false;',
    '  n = -sign(d) * step(vec3(tn), lo); t = tn; return true; }',
    'bool cylinder(vec3 ro, vec3 rd, vec2 c, float r, float y0, float y1, inout float t, inout vec3 n){',
    '  vec2 o = ro.xz - c; float a = dot(rd.xz, rd.xz); float b = dot(o, rd.xz); float q = dot(o, o) - r * r;',
    '  float disc = b * b - a * q; if (a < 1e-8 || disc < 0.0) return false;',
    '  float tt = (-b - sqrt(disc)) / a; if (tt < 0.0 || tt >= t) return false;',
    '  vec3 p = ro + rd * tt; if (p.y < y0 || p.y > y1) return false;',
    '  t = tt; n = normalize(vec3(p.x - c.x, 0.0, p.z - c.y)); return true; }',
    'bool sphere(vec3 ro, vec3 rd, vec3 c, float r, inout float t, inout vec3 n){',
    '  vec3 o = ro - c; float b = dot(o, rd); float q = dot(o, o) - r * r; float disc = b * b - q;',
    '  if (disc < 0.0) return false; float tt = -b - sqrt(disc);',
    '  if (tt < 0.0 || tt >= t) return false;',
    '  t = tt; n = normalize(ro + rd * tt - c); return true; }',
    // The furniture, room by room from the front. Gives the color of what is hit in rgb, and in w:
    // -1 nothing, 0 furniture, 1 a lit lamp.
    'vec4 furniture(vec3 ro, vec3 rd, inout float t, inout vec3 n){',
    '  vec4 r = vec4(0.0, 0.0, 0.0, -1.0);',
    // living room
    '  if (box(ro, rd, vec3(-0.75, FLOOR, -1.2), vec3(0.45, FLOOR + 0.03, 0.2), t, n)) r = vec4(0.60, 0.42, 0.36, 0.0);',
    '  if (box(ro, rd, vec3(-0.6, FLOOR + 0.03, -1.0), vec3(0.3, FLOOR + 0.035, 0.0), t, n)) r = vec4(0.78, 0.60, 0.48, 0.0);',
    '  if (box(ro, rd, vec3(-1.5, FLOOR, -1.3), vec3(-0.95, FLOOR + 0.4, 0.2), t, n)) r = vec4(0.77, 0.54, 0.48, 0.0);',
    '  if (box(ro, rd, vec3(-1.5, FLOOR + 0.4, -1.3), vec3(-1.3, FLOOR + 0.85, 0.2), t, n)) r = vec4(0.77, 0.54, 0.48, 0.0);',

    // the posts of the gaps between the rooms, in wood
    '  for (int k = 0; k < DIVIDER_COUNT; k++) {',
    '    float z = DIVIDER_FIRST - DIVIDER_GAP * float(k);',
    '    if (box(ro, rd, vec3(-0.46, FLOOR, z - 0.05), vec3(-0.4, FLOOR + 1.9, z + 0.05), t, n)) r = vec4(0.43, 0.29, 0.21, 0.0);',
    '    if (box(ro, rd, vec3(0.4, FLOOR, z - 0.05), vec3(0.46, FLOOR + 1.9, z + 0.05), t, n)) r = vec4(0.43, 0.29, 0.21, 0.0);',
    '    if (box(ro, rd, vec3(-0.46, FLOOR + 1.85, z - 0.05), vec3(0.46, FLOOR + 1.9, z + 0.05), t, n)) r = vec4(0.43, 0.29, 0.21, 0.0);',
    '  }',
    '  return r; }',
    // a shadow: is there furniture between the point and the light?
    'bool shadowed(vec3 p, vec3 l, float dl){ float t = dl; vec3 n = vec3(0.0); return furniture(p, l, t, n).w >= 0.0; }',
    'void main(){',
    '  vec2 s = (gl_FragCoord.xy - 0.5 * uRes) / uRes.x * FIELD;',
    // uCam: where the view is in the corridor (x sideways, z forward). The entity stays still on
    // the screen.
    '  vec3 ro = vec3(uCam.x, 0.0, EYE_Z + uCam.y); vec3 rd = turn(normalize(vec3(s, -FOCAL)));',
    '  vec3 E = ro + turn(vec3(uPos, -FOCAL) * (RADIUS / (R0 * uSc)));',
    '  float t = 1e9; vec3 n = vec3(0.0); float k;',
    '  if (rd.y < 0.0) { k = (FLOOR - ro.y) / rd.y; if (k < t) { t = k; n = vec3(0, 1, 0); } }',
    '  if (rd.y > 0.0) { k = (CEILING - ro.y) / rd.y; if (k < t) { t = k; n = vec3(0, -1, 0); } }',
    '  if (rd.x < 0.0) { k = (-HALF_WIDTH - ro.x) / rd.x; if (k < t) { t = k; n = vec3(1, 0, 0); } }',
    '  if (rd.x > 0.0) { k = (HALF_WIDTH - ro.x) / rd.x; if (k < t) { t = k; n = vec3(-1, 0, 0); } }',
    // the end of the corridor, and a wall behind: so looking back the room does not go dark
    '  if (rd.z < 0.0) { k = (BACK_Z - ro.z) / rd.z; if (k < t) { t = k; n = vec3(0, 0, 1); } }',
    '  if (rd.z > 0.0) { k = (BEHIND_Z - ro.z) / rd.z; if (k < t) { t = k; n = vec3(0, 0, -1); } }',
    '  float tz = t;',
    '  for (int j = 0; j < DIVIDER_COUNT; j++) t = divider(ro, rd, DIVIDER_FIRST - DIVIDER_GAP * float(j), t);',
    '  if (t < tz) n = vec3(0, 0, 1);',
    '  vec4 furn = furniture(ro, rd, t, n); bool hitFurn = furn.w >= 0.0;',
    '  vec3 p = ro + rd * t;',
    '  vec3 alb = hitFurn ? furn.rgb : uWalls;',
    '  vec3 l = vec3(-0.9, 2.3, 1.6) - p; float dl = length(l); l /= dl;',
    '  float diff = max(dot(n, l), 0.0) / (1.0 + 0.12 * dl * dl);',
    '  if (diff > 0.0 && shadowed(p + n * 0.01, l, dl)) diff *= 0.3;',
    '  vec3 toEntity = E - p; float h = clamp(dot(toEntity, l), 0.0, dl); float shade = smoothstep(RADIUS * 0.5, RADIUS * 1.6, length(toEntity - l * h));',
    '  float edge = 1.0;',
    '  edge *= mix(smoothstep(0.0, 0.7, HALF_WIDTH - abs(p.x)), 1.0, abs(n.x));',
    '  edge *= mix(smoothstep(0.0, 0.7, p.y - FLOOR), 1.0, step(0.5, n.y));',
    '  edge *= mix(smoothstep(0.0, 0.7, CEILING - p.y), 1.0, step(0.5, -n.y));',
    '  edge *= mix(smoothstep(0.0, 0.7, p.z - BACK_Z), 1.0, abs(n.z));',
    '  edge = hitFurn ? 1.0 : 0.4 + 0.6 * edge;',
    '  float ao = hitFurn ? 0.5 + 0.5 * smoothstep(0.0, 0.3, p.y - FLOOR) : 1.0;',
    '  float de = length(toEntity); float rim = 0.5 * max(dot(n, toEntity / de), 0.0) / (1.0 + 1.3 * de * de);',
    '  vec3 col = (alb * (0.10 + 3.0 * diff * (0.22 + 0.78 * shade)) * (1.0 - 0.65 * uDark) + uMid * rim) * edge * ao;',
    // the floor lamp warms the nearby surfaces
    '  vec3 floorLamp = vec3(-1.15, FLOOR + 1.6, -1.7) - p; float dFloorLamp = length(floorLamp); floorLamp /= dFloorLamp;',
    '  col += alb * vec3(1.0, 0.72, 0.42) * max(dot(n, floorLamp), 0.0) * 0.8 / (1.0 + 2.0 * dFloorLamp * dFloorLamp) * (0.35 + 0.65 * uDark);',
    // and the nightstand lamp, in the bedroom
    '  vec3 bedLamp = vec3(0.25, FLOOR + 0.65, -4.3) - p; float dBedLamp = length(bedLamp); bedLamp /= dBedLamp;',
    '  col += alb * vec3(1.0, 0.72, 0.42) * max(dot(n, bedLamp), 0.0) * 0.8 / (1.0 + 4.0 * dBedLamp * dBedLamp) * (0.35 + 0.65 * uDark);',
    // the wall behind gets no lamp light: a little hall light, so it is not black
    '  if (n.z < -0.5) col += alb * 0.3 * (1.0 - 0.65 * uDark) * edge;',
    '  if (hitFurn && furn.w > 0.5) col = furn.rgb;',
    '  col *= exp(-0.16 * max(t - 2.0, 0.0));',
    '  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 120.0;',

  // The smoke: a ball whose edge is displaced by noise warped twice, with its own shadow toward the
  // light. The noise is read from an image instead of computed (one read per sample in place of
  // eight computations): the phone cannot keep up otherwise.
  var SMOKE = COMMON + [
    'uniform sampler2D uNoise; uniform float uT; uniform float uI; uniform float uEye; uniform float uTilt;',
    'const float SHELL = 0.30; const float ROTATION = 0.05; const float TWIST = 0.9; const float AGITATION = 0.7;',
    'const float SWIRL_SCALE = 1.6; const float MASS_SCALE = 2.6; const float RELIEF = 1.7;',
    'const float EDGE_FROM = 0.04; const float EDGE_TO = 0.6; const float DENSITY = 12.0;',
    'const float SELF_SHADOW = 1.9; const float REFLECTION = 0.25; const float CONTRAST = 2.2;',
    'const mat3 M = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);',
    // In the image the green is the red shifted by (37, 17): one read gives two neighboring layers.
    'float vn(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);',
    '  vec2 rg = texture2D(uNoise, (i.xy + vec2(37.0, 17.0) * i.z + f.xy + 0.5) / 256.0).xy; return mix(rg.x, rg.y, f.z); }',
    'float fbm(vec3 p){ float s = 0.0; float a = 0.5; for (int i = 0; i < 4; i++) { s += a * vn(p); p = M * p * 2.01; a *= 0.5; } return s / 0.9375; }',
    'float fbm2(vec3 p){ return (vn(p) + 0.5 * vn(M * p * 2.01)) / 1.5; }',
    'float dens(vec3 p, bool full){',
    '  float r = length(p); float g = (R0 - r) / SHELL; if (g < -1.0) return 0.0;',
    '  vec3 q = p; q.xz = rot(TWIST * r + uT * ROTATION) * q.xz; float ag = AGITATION + 0.3 * uI;',
    '  vec3 w = vec3(vn(q * SWIRL_SCALE + vec3(0.0, uT * 0.55, 0.0)), vn(q * SWIRL_SCALE + vec3(5.2, 1.3, uT * 0.45)), vn(q * SWIRL_SCALE + vec3(uT * 0.4, 8.1, 2.4))) - 0.5;',
    '  if (!full) { q += w * ag * 0.6; return smoothstep(0.1, 0.5, g + (vn(q * 3.0) - 0.5) * 1.6); }',
    '  q += w * ag;',
    '  vec3 w2 = vec3(fbm2(q * SWIRL_SCALE * 1.6 + vec3(1.7, uT * 0.35, 4.2)), fbm2(q * SWIRL_SCALE * 1.6 + vec3(uT * 0.3, 6.3, 0.9)), fbm2(q * SWIRL_SCALE * 1.6 + vec3(3.1, 2.8, uT * 0.32))) - 0.5;',
    '  q += w2 * ag * 0.8;',
    '  return smoothstep(EDGE_FROM, EDGE_TO, g + (fbm(q * MASS_SCALE + vec3(0.0, 0.0, uT * 0.28)) - 0.45) * RELIEF); }',
    'void main(){',
    '  vec2 c = (gl_FragCoord.xy / uRes * 2.0 - 1.0) * RB; float h2 = RB * RB - dot(c, c);',
    '  if (h2 <= 0.0) { gl_FragColor = vec4(0.0); return; }',
    '  vec3 col = vec3(0.0); float T = 1.0;',
    '  float h = sqrt(h2); const int N = 16; float dz = 2.0 * h / float(N);',
    '  float z = h - dz * 0.35 * fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));',
    '  for (int i = 0; i < N; i++) {',
    '    vec3 p = vec3(c, z); float d = dens(p, true);',
    '    if (d > 0.03) {',
    '      float lit = exp(-2.4 * dens(p + L * 0.3, false) * SELF_SHADOW); float towardViewer = smoothstep(-0.9, 0.9, z);',
    '      vec3 base = mix(uDeep, uMid, clamp(lit * 0.95 + 0.1 * towardViewer, 0.0, 1.0));',
    '      base += uLight * pow(lit, CONTRAST) * (0.2 + REFLECTION * towardViewer);',
    '      float a = 1.0 - exp(-d * dz * DENSITY); col += T * a * base; T *= 1.0 - a; if (T < 0.03) break;',
    '    }',
    '    z -= dz;',
    '  }',
    // the eye sockets in shadow, where the face will rest the eyes
    '  vec2 f = rot(uTilt) * c;',
    '  for (int j = 0; j < 2; j++) {',
    '    vec2 d = (f - vec2(j == 0 ? -EYE.x : EYE.x, EYE.y)) / (BULB * uEye);',
    '    col *= 1.0 - 0.42 * smoothstep(2.1, 1.0, dot(d, d));',
    '  }',
    '  gl_FragColor = vec4(col, 1.0 - T); }'
  ].join('\n');

  // The face: two eyeballs (spheres with iris, pupil and highlight), eyelids that are caps in the
  // smoke's color, tube eyebrows. The light is the same as the smoke's.
  var EYES = COMMON + [
    'uniform vec2 uGaze; uniform vec4 uLid; uniform vec4 uBrow; uniform float uPup; uniform float uEye; uniform float uTilt;',
    'vec4 eyeball(vec2 f, float side, float up, float down){',
    '  vec2 d = (f - vec2(side * EYE.x, EYE.y)) / (BULB * uEye); float r2 = dot(d, d);',
    '  if (r2 > 1.0) return vec4(0.0);',
    '  float z = sqrt(1.0 - r2); vec3 n = vec3(d, z); float lum = max(dot(n, L), 0.0);',
    '  vec3 col = vec3(0.95, 0.96, 1.0) * (0.62 + 0.5 * lum);',
    '  col = mix(col, uMid * 0.9, 0.55 * pow(1.0 - z, 1.6));',
    '  float ca = dot(n, normalize(vec3(uGaze * 1.15, 1.0)));',
    '  vec3 iris = mix(uMid + uLight * 0.35, uDeep * 1.4, smoothstep(0.76, 0.95, ca)) * (0.75 + 0.5 * lum);',
    '  iris *= 1.0 - 0.45 * smoothstep(0.82, 0.76, ca);',
    '  col = mix(col, iris, smoothstep(0.755, 0.775, ca));',
    '  float pupilEdge = 1.0 - 0.075 * uPup * uPup;',
    '  col = mix(col, vec3(0.008, 0.012, 0.035), smoothstep(pupilEdge, pupilEdge + 0.012, ca));',
    '  col += vec3(1.0) * smoothstep(0.955, 0.975, dot(n, normalize(vec3(-0.36, 0.46, 0.81))));',
    '  col += vec3(0.75) * smoothstep(0.992, 0.997, dot(n, normalize(vec3(0.28, -0.30, 0.91))));',
    '  down = max(down, 0.46 * smoothstep(0.55, 1.0, up));',
    '  float yUp = 1.06 - 1.46 * up - 0.22 * d.x * d.x;',
    '  float yDown = -1.06 + down * (0.9 + 0.7 * (1.0 - d.x * d.x));',
    '  col *= 1.0 - 0.5 * smoothstep(0.34, 0.0, yUp - d.y);',
    '  float above = smoothstep(yUp - 0.035, yUp + 0.035, d.y); float below = smoothstep(yDown + 0.035, yDown - 0.035, d.y);',
    '  vec3 skin = mix(uMid, uLight, 0.3) * (0.4 + 0.9 * lum);',
    '  col = mix(col, skin, max(above, below));',
    '  col *= 1.0 - 0.75 * smoothstep(0.07, 0.0, abs(d.y - yUp));',

    else if (e.type === 'say') window.pim.say(e.text);
    else if (e.type === 'heard') window.pim.heard(e.text);
    else if (e.type === 'gesture') window.pim.gesture(e.name);
    else if (e.type === 'work') window.pim.work(e.active);
    else if (e.type === 'queued') window.pim.queued(e.text);
    else if (e.type === 'voice') voiceEvent(e.state, e.text);
    else if (e.type === 'camera') cameraEvent(e.state, e.number);
    else if (e.type === 'surface') { if (e.url) openPanel(e.title || 'Pagina', e.url, e.mode); else openPanel(); }
    else if (e.type === 'walk') window.pim.walk(e.direction, e.amount);
    else if (e.type === 'turn') window.pim.turn(e.direction, e.amount);
    else if (e.type === 'house') loadHouse();
    else if (e.type === 'volume') showVolume(e.level);
    else if (e.type === 'off_charging') { elOffCharging.hidden = !e.active; if (e.active) refreshStatus(); }
    else if (e.type === 'screen') { if (e.on && paused) refreshStatus(); elBlackout.hidden = e.on; paused = !e.on; if (e.on) startFrames(); }
  };

  window.addEventListener('resize', function () { measure(); furnish(); });
  measure();
  setTint('blue');
  furnish();
  loadHouse();
  updateClock(); setInterval(updateClock, 5000);
  // With the screen off the bar is not visible: the status is not requested.
  refreshStatus(); setInterval(function () { if (!paused) refreshStatus(); }, 10000);
  startFrames();
})();
</script>
</body>
</html>
