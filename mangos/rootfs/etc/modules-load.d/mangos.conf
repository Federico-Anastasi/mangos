# Kernel modules mangOS loads at boot. They are our own modules (mangos/tools/), installed by
# scripts/install_modules.sh into the folder of the kernel they belong to.

# Reboot target: tells the bootloader where to restart from (boot, recovery, download mode).
reboot_target
# GPU frequency (chosen by the bridge: full speed while the screen is on).
acpm_gpu
# Chip temperature, throttling the CPUs and the GPU when it gets hot.
acpm_thermal
